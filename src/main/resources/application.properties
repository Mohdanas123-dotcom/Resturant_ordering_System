spring.application.name=restaurant-management-system
server.port=8080
server.compression.enabled=true

# Database: file-based H2 so data survives restarts. See README to switch to MySQL/PostgreSQL.
spring.datasource.url=jdbc:h2:file:./data/rmsdb;AUTO_SERVER=TRUE
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true

# JPA / performance
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.default_batch_fetch_size=50
spring.jpa.properties.hibernate.jdbc.batch_size=25
spring.jpa.properties.hibernate.order_inserts=true
